[greeter]
background=/usr/share/backgrounds/eonlux/eonlux-wallpaper-1.jpg
theme-name=EonLux-Legacy
icon-theme-name=Papirus-Dark
font-name=Inter 10
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%H:%M - %d/%m/%Y
position=50%,center 52%,center
default-user-image=/usr/share/eonlux/assets/logo.png
