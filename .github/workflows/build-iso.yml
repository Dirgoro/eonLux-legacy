name: Build EonLux Legacy ISO

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versão da build (ex: v0.2-alpha)'
        required: true
        default: 'v0.2-alpha'
      iso_compression:
        description: 'Compressão SquashFS (zstd = rápido/equilibrado, xz = menor tamanho)'
        required: true
        default: 'zstd'
        type: choice
        options:
          - zstd
          - xz
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-iso:
    name: Construir ISO Debian 13 (trixie) amd64
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Definir variáveis da versão
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          ISO_NAME="eonlux-legacy-${VERSION}-amd64.iso"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "iso_name=${ISO_NAME}" >> "$GITHUB_OUTPUT"
          echo "Versão alvo: ${VERSION} | Arquivo: ${ISO_NAME}"

      - name: Instalar live-build nativo do Debian 13 (Trixie) e ferramentas híbridas
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            zstd \
            xz-utils \
            ca-certificates

      - name: Preparar permissões dos scripts e hooks
        run: |
          chmod +x live-build/auto/config live-build/auto/build live-build/auto/clean
          if [[ -d live-build/config/hooks ]]; then
            find live-build/config/hooks -type f -exec chmod +x {} +
          fi
          if [[ -d live-build/config/includes.chroot/usr/local/bin ]]; then
            find live-build/config/includes.chroot/usr/local/bin -type f -exec chmod +x {} +
          fi

      - name: Configurar e compilar a ISO via live-build
        working-directory: live-build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          rm -rf config/build config/bootstrap config/chroot config/binary config/source config/common
          ./auto/config --compression "${{ github.event.inputs.iso_compression || 'zstd' }}"
          if ! ./auto/build; then
            echo "=== RESUMO DE ERROS DO APT/LIVE-BUILD ==="
            grep -E "^(E:|Err:|dpkg: error)" build*.log | tail -n 30 || true
            exit 1
          fi

      - name: Verificar ISO gerada e calcular SHA256
        working-directory: live-build
        run: |
          GENERATED_ISO=$(find . -maxdepth 1 -type f -name "*.iso" | head -n 1)
          if [[ -z "$GENERATED_ISO" ]]; then
            echo "ERRO CRÍTICO: Nenhuma ISO foi gerada pelo live-build!"
            tail -n 80 build.log || true
            exit 1
          fi

          mkdir -p ../dist
          mv "$GENERATED_ISO" "../dist/${{ steps.meta.outputs.iso_name }}"
          cd ../dist
          sha256sum "${{ steps.meta.outputs.iso_name }}" > "${{ steps.meta.outputs.iso_name }}.sha256"

          xorriso -indev "${{ steps.meta.outputs.iso_name }}" -toc
          ls -lh
          cat "${{ steps.meta.outputs.iso_name }}.sha256"

      - name: Upload da ISO e SHA256 como artefato do Actions
        uses: actions/upload-artifact@v4
        with:
          name: eonlux-legacy-${{ steps.meta.outputs.version }}-amd64
          path: |
            dist/${{ steps.meta.outputs.iso_name }}
            dist/${{ steps.meta.outputs.iso_name }}.sha256
          retention-days: 14

      - name: Publicar GitHub Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.meta.outputs.iso_name }}
            dist/${{ steps.meta.outputs.iso_name }}.sha256
          body_path: docs/releases/${{ steps.meta.outputs.version }}.md
          fail_on_unmatched_files: false
          prerelease: ${{ contains(steps.meta.outputs.version, 'alpha') || contains(steps.meta.outputs.version, 'beta') || contains(steps.meta.outputs.version, 'rc') }}
