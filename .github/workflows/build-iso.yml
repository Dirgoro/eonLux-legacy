name: Build EonLux Legacy ISO

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versão da build (ex: v0.1-alpha)'
        required: true
        default: 'v0.1-alpha'
      iso_compression:
        description: 'Compressão SquashFS (zstd = rápido/equilibrado, xz = menor tamanho)'
        required: true
        default: 'zstd'
        type: choice
        options:
          - zstd
          - xz
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-iso:
    name: Construir ISO Debian 13 (trixie) amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Definir variáveis da versão
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          ISO_NAME="eonlux-legacy-${VERSION}-amd64.iso"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "iso_name=${ISO_NAME}" >> "$GITHUB_OUTPUT"
          echo "Versão alvo: ${VERSION} | Arquivo: ${ISO_NAME}"

      - name: Liberar espaço em disco no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - name: Instalar dependências do Debian live-build e bootloader híbrido
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            squashfs-tools \
            zstd \
            xz-utils \
            ca-certificates \
            curl

          # Garante suporte ao codinome trixie no debootstrap caso o host seja anterior
          if [[ ! -e /usr/share/debootstrap/scripts/trixie ]]; then
            sudo ln -s /usr/share/debootstrap/scripts/sid /usr/share/debootstrap/scripts/trixie
          fi

      - name: Executar auditoria pré-build do repositório
        run: |
          chmod +x live-build/scripts/audit-repo.sh || true
          if [[ -f live-build/scripts/audit-repo.sh ]]; then
            ./live-build/scripts/audit-repo.sh
          else
            find live-build/auto -type f -exec chmod +x {} +
            find live-build/config -type f \( -name "*.hook.*" -o -name "*.sh" \) -exec chmod +x {} +
          fi

      - name: Configurar e construir a imagem ISO (lb config && lb build)
        working-directory: live-build
        run: |
          sudo lb clean --purge || true
          sudo lb config
          sudo lb build 2>&1 | tee build.log

      - name: Verificar ISO gerada e calcular SHA256
        id: verify
        working-directory: live-build
        run: |
          GENERATED_ISO=$(find . -maxdepth 1 -type f -name "*.iso" | head -n 1)
          if [[ -z "$GENERATED_ISO" ]]; then
            echo "ERRO CRÍTICO: Nenhuma ISO foi gerada pelo live-build!"
            tail -n 100 build.log
            exit 1
          fi

          mkdir -p ../dist
          mv "$GENERATED_ISO" "../dist/${{ steps.meta.outputs.iso_name }}"
          cd ../dist
          sha256sum "${{ steps.meta.outputs.iso_name }}" > "${{ steps.meta.outputs.iso_name }}.sha256"

          echo "=== Verificação da tabela ISO9660/El Torito ==="
          xorriso -indev "${{ steps.meta.outputs.iso_name }}" -toc
          ls -lh
          cat "${{ steps.meta.outputs.iso_name }}.sha256"

      - name: Upload da ISO e SHA256 como artefato do Actions
        uses: actions/upload-artifact@v4
        with:
          name: eonlux-legacy-${{ steps.meta.outputs.version }}-amd64
          path: |
            dist/${{ steps.meta.outputs.iso_name }}
            dist/${{ steps.meta.outputs.iso_name }}.sha256
          retention-days: 14

      - name: Publicar GitHub Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.meta.outputs.iso_name }}
            dist/${{ steps.meta.outputs.iso_name }}.sha256
          body_path: docs/releases/${{ steps.meta.outputs.version }}.md
          fail_on_unmatched_files: false
          prerelease: ${{ contains(steps.meta.outputs.version, 'alpha') || contains(steps.meta.outputs.version, 'beta') || contains(steps.meta.outputs.version, 'rc') }}
